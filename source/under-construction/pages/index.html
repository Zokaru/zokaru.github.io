<esta-template template="layout" title="{{ t: 'title' }}">
  <div class="mainCont underConstruction">
    <main>
      <section class="startCont">
        <div class="startContent">
          <img src="{{ asset: 'images/logo/dsLogo_grey.svg' }}" alt="" class="startLogo">
          <div class="startTitleCont">
            <h1 class="startTitle">{{ t: 'daniel_sanchez' }}</h1>
          </div>
          <p class="startSubtitle">
            {{ t: 'home.start.subtitle_1' }}
            <strong>{{ t: 'home.start.subtitle_2' }}</strong>
            {{ t: 'home.start.subtitle_3' }}
            <strong>{{ t: 'home.start.subtitle_4' }}</strong>
            {{ t: 'home.start.subtitle_5' }}
          </p>
          <ul class="unstyledList ucLinks">
            <li>
              <a href="mailto:contact@dsanchez.org" target="_blank" class="button button_link">
                <img src="{{ asset: 'images/icons/email.svg' }}" alt="" class="icon">
                hello@danielsanchez.xyz
              </a>
            </li>
            <li>
              <a href="https://linkedin.com/in/danielsdesign" target="_blank" class="button button_link">
                <img src="{{ asset: 'images/icons/linkedin.svg' }}" alt="" class="icon">
                danielsdesign
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>
  </div>
</esta-template>
